[workspace]
members = ["openitb-game", "openitb-engine"]
resolver = "2"

[workspace.dependencies]
# Game dependencies
macroquad = "0.4"
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# Game logic
glam = "0.29"
image = "0.25"